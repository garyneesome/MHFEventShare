name: Build Android APK v0.13.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch source
        uses: actions/checkout@v4

      - name: Download v0.13.1 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34618122974 -R garyneesome/MHFEventShare -n MHFEventShare-v0.13.1-source -D base
          unzip -q base/MHFEventShare-v0.13.1-source.zip
          test -d MHFEventShare-v0.13.1

      - name: Recreate v0.13.2 Fast Text setup
        run: |
          cat v0132_patch/chunks/v0132_code.b64.* | base64 -d | gzip -d > v0132.patch
          test -s v0132.patch
          patch -p1 -d MHFEventShare-v0.13.1 < v0132.patch
          mv MHFEventShare-v0.13.1 MHFEventShare-v0.13.2
          sed -i 's/Settings.ACTION_MANAGE_SPECIAL_APP_ACCESSES/Settings.ACTION_APPLICATION_SETTINGS/g' MHFEventShare-v0.13.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q "versionName '0.13.2'" MHFEventShare-v0.13.2/app/build.gradle
          grep -q 'showSmsSetupAssistant' MHFEventShare-v0.13.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'smsSetupConfirmed' MHFEventShare-v0.13.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/Models.java
          sed -E -i 's/^([[:space:]]*)versionCode[[:space:]]+[0-9]+/\1versionCode 132/' MHFEventShare-v0.13.2/app/build.gradle

      - name: Apply v0.13.3 visual colour controls and UI polish
        run: |
          python3 v0133_patch/apply_v0133.py MHFEventShare-v0.13.2
          mv MHFEventShare-v0.13.2 MHFEventShare-v0.13.3
          python3 v0133_patch/apply_v0133_polish.py MHFEventShare-v0.13.3
          grep -q "versionCode 133" MHFEventShare-v0.13.3/app/build.gradle
          grep -q "versionName '0.13.3'" MHFEventShare-v0.13.3/app/build.gradle
          grep -q 'Header & accent colour' MHFEventShare-v0.13.3/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'Page background colour' MHFEventShare-v0.13.3/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'Before you use Fast Text' MHFEventShare-v0.13.3/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'Delete event' MHFEventShare-v0.13.3/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java

      - name: Apply v0.13.4 event actions and colour palette
        run: |
          python3 v0134_patch/apply_v0134.py MHFEventShare-v0.13.3
          mv MHFEventShare-v0.13.3 MHFEventShare-v0.13.4
          grep -q "versionCode 134" MHFEventShare-v0.13.4/app/build.gradle
          grep -q "versionName '0.13.4'" MHFEventShare-v0.13.4/app/build.gradle
          grep -q 'Button actions = secondaryButton("Actions"' MHFEventShare-v0.13.4/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'Colour palette' MHFEventShare-v0.13.4/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'Tap a colour below' MHFEventShare-v0.13.4/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java

      - name: Package v0.13.4 source
        run: zip -qr MHFEventShare-v0.13.4-source.zip MHFEventShare-v0.13.4

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHFEventShare-v0.13.4-source
          path: MHFEventShare-v0.13.4-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build v0.13.4 APK
        working-directory: MHFEventShare-v0.13.4
        run: gradle assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp MHFEventShare-v0.13.4/app/build/outputs/apk/debug/app-debug.apk MHF-Event-Share-v0.13.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHF-Event-Share-v0.13.4
          path: MHF-Event-Share-v0.13.4.apk
          if-no-files-found: error

      - name: Publish GitHub Release for in-app updater
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Saved events now have a visible Actions button for Edit, Duplicate, Delete and the other event actions, while left-swipe remains available as a shortcut. The branding colour picker now includes a 20-colour tap-to-select palette, with the existing Hue, Colour strength and Brightness sliders retained for custom colours."
          if gh release view v0.13.4 >/dev/null 2>&1; then
            gh release upload v0.13.4 MHF-Event-Share-v0.13.4.apk --clobber
          else
            gh release create v0.13.4 MHF-Event-Share-v0.13.4.apk --title "MHF Event Share v0.13.4" --notes "$NOTES"
          fi

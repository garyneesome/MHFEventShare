name: Build Android APK v0.14.0 Workflow Polish

on:
  push:
    branches: [ workflow-polish-v0.14.0 ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v0.14.0 branch
        uses: actions/checkout@v4

      - name: Download tested v0.13.6 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34690668913 -R garyneesome/MHFEventShare -n MHFEventShare-v0.13.6-source -D base
          unzip -q base/MHFEventShare-v0.13.6-source.zip
          test -d MHFEventShare-v0.13.6

      - name: Apply v0.14.0 workflow and UI polish
        run: |
          base64 -d v0140_patch/v0140.patch.gz.b64 | gzip -d > v0140.patch
          test -s v0140.patch
          patch -p1 -d MHFEventShare-v0.13.6 < v0140.patch
          mv MHFEventShare-v0.13.6 MHFEventShare-v0.14.0
          grep -q "versionCode 140" MHFEventShare-v0.14.0/app/build.gradle
          grep -q "versionName '0.14.0'" MHFEventShare-v0.14.0/app/build.gradle
          grep -q 'Quick share' MHFEventShare-v0.14.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'Save as template' MHFEventShare-v0.14.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'setStickyAction' MHFEventShare-v0.14.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'releases?per_page=20' MHFEventShare-v0.14.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'List<EventDraft> templates()' MHFEventShare-v0.14.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/Repo.java

      - name: Package v0.14.0 source
        run: zip -qr MHFEventShare-v0.14.0-source.zip MHFEventShare-v0.14.0

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHFEventShare-v0.14.0-source
          path: MHFEventShare-v0.14.0-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build v0.14.0 APK
        working-directory: MHFEventShare-v0.14.0
        run: gradle assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp MHFEventShare-v0.14.0/app/build/outputs/apk/debug/app-debug.apk MHF-Event-Share-v0.14.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHF-Event-Share-v0.14.0
          path: MHF-Event-Share-v0.14.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Workflow and usability update. Adds a persistent bottom primary action on long screens, a cleaner event editor with collapsible optional settings, Quick share, reusable event templates, an improved send review showing channel counts/attachments/SMS link and missing-contact warnings, clearer success feedback, and visual consistency improvements. The updater now scans published releases robustly instead of relying only on GitHub's latest marker. The scroll-aware Mental Health Friends header remains: it hides while scrolling down and returns when scrolling up."
          if gh release view v0.14.0 -R garyneesome/MHFEventShare >/dev/null 2>&1; then
            gh release upload v0.14.0 MHF-Event-Share-v0.14.0.apk -R garyneesome/MHFEventShare --clobber
          else
            gh release create v0.14.0 MHF-Event-Share-v0.14.0.apk -R garyneesome/MHFEventShare --target workflow-polish-v0.14.0 --title "MHF Event Share v0.14.0" --notes "$NOTES"
          fi

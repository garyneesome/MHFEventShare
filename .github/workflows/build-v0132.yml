name: Build Android APK v0.13.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch source
        uses: actions/checkout@v4

      - name: Download v0.13.1 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34618122974 -R garyneesome/MHFEventShare -n MHFEventShare-v0.13.1-source -D base
          unzip -q base/MHFEventShare-v0.13.1-source.zip
          test -d MHFEventShare-v0.13.1

      - name: Apply v0.13.2 private multi-SMS setup
        run: |
          cat v0132_patch/chunks/v0132_code.b64.* | base64 -d | gzip -d > v0132.patch
          test -s v0132.patch
          patch -p1 -d MHFEventShare-v0.13.1 < v0132.patch
          mv MHFEventShare-v0.13.1 MHFEventShare-v0.13.2
          grep -q "versionName '0.13.2'" MHFEventShare-v0.13.2/app/build.gradle
          grep -q 'showSmsSetupAssistant' MHFEventShare-v0.13.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'smsSetupConfirmed' MHFEventShare-v0.13.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/Models.java
          grep -q 'Send all texts in one go' MHFEventShare-v0.13.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java

      - name: Package v0.13.2 source
        run: zip -qr MHFEventShare-v0.13.2-source.zip MHFEventShare-v0.13.2

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHFEventShare-v0.13.2-source
          path: MHFEventShare-v0.13.2-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build v0.13.2 APK
        working-directory: MHFEventShare-v0.13.2
        run: gradle assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp MHFEventShare-v0.13.2/app/build/outputs/apk/debug/app-debug.apk MHF-Event-Share-v0.13.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHF-Event-Share-v0.13.2
          path: MHF-Event-Share-v0.13.2.apk
          if-no-files-found: error

      - name: Publish GitHub Release for in-app updater
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Keeps the v0.13.1 event accordions, swipe actions and mental-health ideas, and adds a one-time private multi-SMS setup assistant. MHF can open all selected SMS recipients in one Messages compose screen after Mass text is configured. It links to Google Messages and Android Special app access and explains Mass text, RCS and Premium SMS settings. Android still requires the user to change protected messaging settings manually. After batch sending, MHF records sent/failed status per person."
          if gh release view v0.13.2 >/dev/null 2>&1; then
            gh release upload v0.13.2 MHF-Event-Share-v0.13.2.apk --clobber
          else
            gh release create v0.13.2 MHF-Event-Share-v0.13.2.apk --title "MHF Event Share v0.13.2" --notes "$NOTES"
          fi

name: Build Android APK v0.14.1 Header Flicker Fix

on:
  push:
    branches: [ workflow-polish-v0.14.1 ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v0.14.1 branch
        uses: actions/checkout@v4

      - name: Download tested v0.14.0 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34691257838 -R garyneesome/MHFEventShare -n MHFEventShare-v0.14.0-source -D base
          unzip -q base/MHFEventShare-v0.14.0-source.zip
          test -d MHFEventShare-v0.14.0

      - name: Apply v0.14.1 header flicker fix
        run: |
          base64 -d v0141_patch/v0141.patch.gz.b64 | gzip -d > v0141.patch
          test -s v0141.patch
          patch -p1 -d MHFEventShare-v0.14.0 < v0141.patch
          mv MHFEventShare-v0.14.0 MHFEventShare-v0.14.1
          grep -q "versionCode 141" MHFEventShare-v0.14.1/app/build.gradle
          grep -q "versionName '0.14.1'" MHFEventShare-v0.14.1/app/build.gradle
          grep -q 'headerTouchTravel' MHFEventShare-v0.14.1/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'setOnTouchListener' MHFEventShare-v0.14.1/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java

      - name: Package v0.14.1 source
        run: zip -qr MHFEventShare-v0.14.1-source.zip MHFEventShare-v0.14.1

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHFEventShare-v0.14.1-source
          path: MHFEventShare-v0.14.1-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build v0.14.1 APK
        working-directory: MHFEventShare-v0.14.1
        run: gradle assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp MHFEventShare-v0.14.1/app/build/outputs/apk/debug/app-debug.apk MHF-Event-Share-v0.14.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHF-Event-Share-v0.14.1
          path: MHF-Event-Share-v0.14.1.apk
          if-no-files-found: error

      - name: Publish GitHub Release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Fixes the header flicker seen while scrolling. Header visibility now follows deliberate finger direction with movement thresholds rather than ScrollView position changes caused by the header resizing itself. Repeated hide/show requests are ignored so overlapping animations cannot stack. All v0.14.0 workflow, attachments, templates, quick share, send review and updater improvements are retained."
          if gh release view v0.14.1 -R garyneesome/MHFEventShare >/dev/null 2>&1; then
            gh release upload v0.14.1 MHF-Event-Share-v0.14.1.apk -R garyneesome/MHFEventShare --clobber
          else
            gh release create v0.14.1 MHF-Event-Share-v0.14.1.apk -R garyneesome/MHFEventShare --target workflow-polish-v0.14.1 --title "MHF Event Share v0.14.1" --notes "$NOTES"
          fi

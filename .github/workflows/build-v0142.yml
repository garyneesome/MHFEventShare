name: Build Android APK v0.14.2 Header Overlay Fix

on:
  push:
    branches: [ workflow-polish-v0.14.2 ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v0.14.2 branch
        uses: actions/checkout@v4

      - name: Download tested v0.14.1 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34691786662 -R garyneesome/MHFEventShare -n MHFEventShare-v0.14.1-source -D base
          unzip -q base/MHFEventShare-v0.14.1-source.zip
          test -d MHFEventShare-v0.14.1

      - name: Apply v0.14.2 overlay header fix
        run: |
          base64 -d v0142_patch/v0142.patch.gz.b64 | gzip -d > v0142.patch
          test -s v0142.patch
          patch -p1 -d MHFEventShare-v0.14.1 < v0142.patch
          mv MHFEventShare-v0.14.1 MHFEventShare-v0.14.2
          grep -q "versionCode 142" MHFEventShare-v0.14.2/app/build.gradle
          grep -q "versionName '0.14.2'" MHFEventShare-v0.14.2/app/build.gradle
          grep -q 'FrameLayout contentFrame' MHFEventShare-v0.14.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'setOnScrollChangeListener' MHFEventShare-v0.14.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'syncHeaderOverlaySpace' MHFEventShare-v0.14.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          ! grep -q 'ValueAnimator animator = ValueAnimator.ofInt(from, to)' MHFEventShare-v0.14.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java

      - name: Package v0.14.2 source
        run: zip -qr MHFEventShare-v0.14.2-source.zip MHFEventShare-v0.14.2

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHFEventShare-v0.14.2-source
          path: MHFEventShare-v0.14.2-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build v0.14.2 APK
        working-directory: MHFEventShare-v0.14.2
        run: gradle assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp MHFEventShare-v0.14.2/app/build/outputs/apk/debug/app-debug.apk MHF-Event-Share-v0.14.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHF-Event-Share-v0.14.2
          path: MHF-Event-Share-v0.14.2.apk
          if-no-files-found: error

      - name: Publish GitHub Release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Reworks the scrolling header to eliminate flicker and unreliable hiding. The header is now an overlay and only moves using translation, so hiding/showing it never changes the ScrollView height or viewport. Scroll direction is read from stable ScrollView movement, including flings, with hysteresis thresholds to avoid toggling on tiny movements. All v0.14.1 features are retained."
          if gh release view v0.14.2 -R garyneesome/MHFEventShare >/dev/null 2>&1; then
            gh release upload v0.14.2 MHF-Event-Share-v0.14.2.apk -R garyneesome/MHFEventShare --clobber
          else
            gh release create v0.14.2 MHF-Event-Share-v0.14.2.apk -R garyneesome/MHFEventShare --target workflow-polish-v0.14.2 --title "MHF Event Share v0.14.2" --notes "$NOTES"
          fi

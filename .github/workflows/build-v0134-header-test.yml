name: Build Android APK v0.13.4 Header Test

on:
  push:
    branches: [ header-redesign-v0.13.4 ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out header test branch
        uses: actions/checkout@v4

      - name: Download v0.13.1 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34618122974 -R garyneesome/MHFEventShare -n MHFEventShare-v0.13.1-source -D base
          unzip -q base/MHFEventShare-v0.13.1-source.zip
          test -d MHFEventShare-v0.13.1

      - name: Recreate v0.13.2 Fast Text setup
        run: |
          cat v0132_patch/chunks/v0132_code.b64.* | base64 -d | gzip -d > v0132.patch
          test -s v0132.patch
          patch -p1 -d MHFEventShare-v0.13.1 < v0132.patch
          mv MHFEventShare-v0.13.1 MHFEventShare-v0.13.2
          sed -i 's/Settings.ACTION_MANAGE_SPECIAL_APP_ACCESSES/Settings.ACTION_APPLICATION_SETTINGS/g' MHFEventShare-v0.13.2/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          sed -E -i 's/^([[:space:]]*)versionCode[[:space:]]+[0-9]+/\1versionCode 132/' MHFEventShare-v0.13.2/app/build.gradle

      - name: Recreate v0.13.3 visual controls and UI polish
        run: |
          python3 v0133_patch/apply_v0133.py MHFEventShare-v0.13.2
          mv MHFEventShare-v0.13.2 MHFEventShare-v0.13.3
          python3 v0133_patch/apply_v0133_polish.py MHFEventShare-v0.13.3
          grep -q "versionCode 133" MHFEventShare-v0.13.3/app/build.gradle
          grep -q "versionName '0.13.3'" MHFEventShare-v0.13.3/app/build.gradle

      - name: Apply v0.13.4 professional header redesign
        run: |
          patch -p1 -d MHFEventShare-v0.13.3 < v0134_patch/v0134.patch
          grep -q "versionCode 134" MHFEventShare-v0.13.3/app/build.gradle
          grep -q "versionName '0.13.4'" MHFEventShare-v0.13.3/app/build.gradle
          grep -q 'Event Share  •  Stronger together' MHFEventShare-v0.13.3/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          mv MHFEventShare-v0.13.3 MHFEventShare-v0.13.4

      - name: Package v0.13.4 source
        run: zip -qr MHFEventShare-v0.13.4-source.zip MHFEventShare-v0.13.4

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHFEventShare-v0.13.4-source
          path: MHFEventShare-v0.13.4-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build v0.13.4 APK
        working-directory: MHFEventShare-v0.13.4
        run: gradle assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp MHFEventShare-v0.13.4/app/build/outputs/apk/debug/app-debug.apk MHF-Event-Share-v0.13.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHF-Event-Share-v0.13.4
          path: MHF-Event-Share-v0.13.4.apk
          if-no-files-found: error

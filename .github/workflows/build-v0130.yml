name: Build Android APK v0.13.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reconstruct v0.12.0 source
        run: |
          cat source_chunks/source.b64.* | base64 -d > source.zip
          unzip -q source.zip
          mv MHFEventShare-v0.2.0 patchold
          cat v03_patch/patch.b64.* | base64 -d | gzip -d > v03.patch
          patch -p0 < v03.patch
          mv patchold MHFEventShare-v0.3.0
          cat v04_patch/patch.b64.* | base64 -d | gzip -d > v04.patch
          patch -p1 -d MHFEventShare-v0.3.0 < v04.patch
          mv MHFEventShare-v0.3.0 MHFEventShare-v0.4.0
          cat v05_code/v05.b64.* | base64 -d | gzip -d > v05.patch
          patch -p1 -d MHFEventShare-v0.4.0 < v05.patch
          mv MHFEventShare-v0.4.0 MHFEventShare-v0.5.0
          cat v06_patch/v06_code.b64.* | base64 -d | gzip -d > v06.patch
          patch -p1 -d MHFEventShare-v0.5.0 < v06.patch
          mv MHFEventShare-v0.5.0 MHFEventShare-v0.6.0
          cat v07_patch/v07_code.b64.* | base64 -d | gzip -d > v07.patch
          awk '/^diff --git a\/app\/build.gradle/{copy=1} copy' v07.patch > v07-app.patch
          patch -p1 -d MHFEventShare-v0.6.0 < v07-app.patch
          mv MHFEventShare-v0.6.0 MHFEventShare-v0.7.0
          cat v08_patch/v08_app_code.b64.* | base64 -d | gzip -d > v08.patch
          patch -p1 -d MHFEventShare-v0.7.0 < v08.patch
          base64 -d v08_patch/v08_keystore.b64 > MHFEventShare-v0.7.0/app/mhf-test-debug.keystore
          mv MHFEventShare-v0.7.0 MHFEventShare-v0.8.0
          cat v09_patch/v09_code.b64.* | base64 -d | gzip -d > v09.patch
          patch -p1 -d MHFEventShare-v0.8.0 < v09.patch
          mv MHFEventShare-v0.8.0 MHFEventShare-v0.9.0
          cat v10_patch/chunks/v10_code.b64.* | base64 -d | gzip -d > v10.patch
          patch -p1 -d MHFEventShare-v0.9.0 < v10.patch
          mv MHFEventShare-v0.9.0 MHFEventShare-v0.10.0
          cat v101_patch/v101_code.b64 | base64 -d | gzip -d > v101.patch
          patch -p1 -d MHFEventShare-v0.10.0 < v101.patch
          mv MHFEventShare-v0.10.0 MHFEventShare-v0.10.1
          cat v102_patch/v102_code.b64.* | base64 -d | gzip -d > v102.patch
          patch -p1 -d MHFEventShare-v0.10.1 < v102.patch
          mv MHFEventShare-v0.10.1 MHFEventShare-v0.10.2
          cat v103_patch/v103_code.b64 | base64 -d | gzip -d > v103.patch
          patch -p1 -d MHFEventShare-v0.10.2 < v103.patch
          mv MHFEventShare-v0.10.2 MHFEventShare-v0.10.3
          cat v104_patch/v104_code.b64 | base64 -d | gzip -d > v104.patch
          patch -p1 -d MHFEventShare-v0.10.3 < v104.patch
          mv MHFEventShare-v0.10.3 MHFEventShare-v0.10.4
          cat v105_patch/v105_code.b64 | base64 -d | gzip -d > v105.patch
          patch -p1 -d MHFEventShare-v0.10.4 < v105.patch
          mv MHFEventShare-v0.10.4 MHFEventShare-v0.10.5
          cat v106_patch/v106_code.b64 | base64 -d | gzip -d > v106.patch
          patch -p1 -d MHFEventShare-v0.10.5 < v106.patch
          mv MHFEventShare-v0.10.5 MHFEventShare-v0.10.6
          cat v107_patch/v107_code.b64 | base64 -d | gzip -d > v107.patch
          patch -p1 -d MHFEventShare-v0.10.6 < v107.patch
          mv MHFEventShare-v0.10.6 MHFEventShare-v0.10.7
          cat v108_patch/v108_code.b64 | base64 -d | gzip -d > v108.patch
          patch -p1 -d MHFEventShare-v0.10.7 < v108.patch
          mv MHFEventShare-v0.10.7 MHFEventShare-v0.10.8
          cat v011_patch/v011_code.b64 | base64 -d | gzip -d > v011.patch
          patch -p1 -d MHFEventShare-v0.10.8 < v011.patch
          mv MHFEventShare-v0.10.8 MHFEventShare-v0.11.0
          cat v012_patch/v012_code.b64.* | base64 -d | gzip -d > v012.patch
          patch -p1 -d MHFEventShare-v0.11.0 < v012.patch
          mv MHFEventShare-v0.11.0 MHFEventShare-v0.12.0
          grep -q "versionName '0.12.0'" MHFEventShare-v0.12.0/app/build.gradle

      - name: Apply v0.13.0 workflow polish, private batch SMS and event ideas
        run: |
          cat v013_patch/v013_code.b64 | base64 -d | gzip -d > v013.patch
          test -s v013.patch
          patch -p2 -d MHFEventShare-v0.12.0 < v013.patch
          mv MHFEventShare-v0.12.0 MHFEventShare-v0.13.0
          grep -q "versionName '0.13.0'" MHFEventShare-v0.13.0/app/build.gradle
          grep -q 'android.permission.SEND_SMS' MHFEventShare-v0.13.0/app/src/main/AndroidManifest.xml
          grep -q 'Send selected texts directly from MHF in one step' MHFEventShare-v0.13.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'Event ideas' MHFEventShare-v0.13.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'swipeableEventCard' MHFEventShare-v0.13.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java

      - name: Package v0.13.0 source
        run: zip -qr MHFEventShare-v0.13.0-source.zip MHFEventShare-v0.13.0

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHFEventShare-v0.13.0-source
          path: MHFEventShare-v0.13.0-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build v0.13.0 APK
        working-directory: MHFEventShare-v0.13.0
        run: gradle assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp MHFEventShare-v0.13.0/app/build/outputs/apk/debug/app-debug.apk MHF-Event-Share-v0.13.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHF-Event-Share-v0.13.0
          path: MHF-Event-Share-v0.13.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release for in-app updater
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Simpler send flow: selected texts can now be sent privately from MHF in one confirmed batch, with sent/failed results per person; email remains BCC and WhatsApp has its own final step. Recent/completed events are collapsible and swipe left exposes Edit/Delete. New Event ideas can show curated national mental-health awareness dates and local ideas for Northamptonshire, Oxfordshire and Buckinghamshire, with region filters in Settings and a remotely refreshable source feed."
          if gh release view v0.13.0 >/dev/null 2>&1; then
            gh release upload v0.13.0 MHF-Event-Share-v0.13.0.apk --clobber
          else
            gh release create v0.13.0 MHF-Event-Share-v0.13.0.apk --title "MHF Event Share v0.13.0" --notes "$NOTES"
          fi

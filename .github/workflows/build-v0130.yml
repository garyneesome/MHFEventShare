name: Build Android APK v0.13.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reconstruct v0.12.0 source
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/build-v0120.yml').read_text().splitlines()
          wanted = {
              'Reconstruct v0.11.0 source',
              'Apply v0.12.0 event progress workflow',
          }
          out = ['set -euo pipefail']
          i = 0
          while i < len(src):
              line = src[i]
              if line.startswith('      - name: '):
                  name = line[len('      - name: '):]
                  if name in wanted:
                      i += 1
                      while i < len(src) and src[i].strip() != 'run: |':
                          i += 1
                      if i >= len(src):
                          raise SystemExit(f'run block not found for {name}')
                      i += 1
                      while i < len(src) and not src[i].startswith('      - name: '):
                          l = src[i]
                          if l.startswith('          '):
                              out.append(l[10:])
                          elif l.strip():
                              raise SystemExit(f'unexpected indentation in {name}: {l!r}')
                          else:
                              out.append('')
                          i += 1
                      continue
              i += 1
          if not any('MHFEventShare-v0.12.0' in x for x in out):
              raise SystemExit('failed to extract v0.12 reconstruction blocks')
          Path('/tmp/rebuild-v012.sh').write_text('\n'.join(out) + '\n')
          PY
          bash /tmp/rebuild-v012.sh
          grep -q "versionName '0.12.0'" MHFEventShare-v0.12.0/app/build.gradle

      - name: Apply v0.13.0 improvements
        run: |
          cat v013_patch/v013_code.b64.* | base64 -d | gzip -d > v013.patch
          test -s v013.patch
          patch -p1 -d MHFEventShare-v0.12.0 < v013.patch
          mv MHFEventShare-v0.12.0 MHFEventShare-v0.13.0
          grep -q "versionName '0.13.0'" MHFEventShare-v0.13.0/app/build.gradle
          grep -q 'android.permission.SEND_SMS' MHFEventShare-v0.13.0/app/src/main/AndroidManifest.xml
          grep -q 'directSmsMode' MHFEventShare-v0.13.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/Models.java
          grep -q "Ideas & what's on" MHFEventShare-v0.13.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java
          grep -q 'swipeEventCard' MHFEventShare-v0.13.0/app/src/main/java/uk/co/mentalhealthfriends/eventshare/MainActivity.java

      - name: Package v0.13.0 source
        run: zip -qr MHFEventShare-v0.13.0-source.zip MHFEventShare-v0.13.0

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHFEventShare-v0.13.0-source
          path: MHFEventShare-v0.13.0-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build v0.13.0 APK
        working-directory: MHFEventShare-v0.13.0
        run: gradle assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp MHFEventShare-v0.13.0/app/build/outputs/apk/debug/app-debug.apk MHF-Event-Share-v0.13.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHF-Event-Share-v0.13.0
          path: MHF-Event-Share-v0.13.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release for in-app updater
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Cleaner guided sending: text/email is one step and WhatsApp is the next. Recent and event-status lists are collapsible and event cards support swipe-left Edit/Delete. Optional Fast private text sending attempts one-to-one SMS directly with Android sent/failed callbacks and falls back to the Messages app if the phone blocks SEND_SMS. New Ideas & what's on section provides configurable mental-health awareness dates and curated Northamptonshire, Oxfordshire and Buckinghamshire ideas from a refreshable public feed."
          if gh release view v0.13.0 >/dev/null 2>&1; then
            gh release upload v0.13.0 MHF-Event-Share-v0.13.0.apk --clobber
          else
            gh release create v0.13.0 MHF-Event-Share-v0.13.0.apk --title "MHF Event Share v0.13.0" --notes "$NOTES"
          fi

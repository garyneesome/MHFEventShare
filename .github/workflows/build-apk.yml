name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reconstruct v0.4 source and apply v0.5 code patch
        run: |
          cat source_chunks/source.b64.* | base64 -d > source.zip
          unzip -q source.zip
          mv MHFEventShare-v0.2.0 patchold
          cat v03_patch/patch.b64.* | base64 -d | gzip -d > v03.patch
          patch -p0 < v03.patch
          mv patchold MHFEventShare-v0.3.0
          test -f MHFEventShare-v0.3.0/app/build.gradle
          grep -q "versionName '0.3.0'" MHFEventShare-v0.3.0/app/build.gradle
          cat v04_patch/patch.b64.* | base64 -d | gzip -d > v04.patch
          patch -p1 -d MHFEventShare-v0.3.0 < v04.patch
          mv MHFEventShare-v0.3.0 MHFEventShare-v0.4.0
          test -f MHFEventShare-v0.4.0/app/build.gradle
          grep -q "versionName '0.4.0'" MHFEventShare-v0.4.0/app/build.gradle
          cat v05_code/v05.b64.* | base64 -d | gzip -d > v05.patch
          patch -p1 -d MHFEventShare-v0.4.0 < v05.patch
          mv MHFEventShare-v0.4.0 MHFEventShare-v0.5.0
          test -f MHFEventShare-v0.5.0/app/build.gradle
          grep -q "versionName '0.5.0'" MHFEventShare-v0.5.0/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: MHFEventShare-v0.5.0
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MHF-Event-Share-v0.5.0-debug
          path: MHFEventShare-v0.5.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
